      operationId: getStories
      tags:
      - Feed
      parameters:
      - $ref: '#/components/parameters/ApiKeyQuery'
      - name: Title
        in: query
        description: Filter stories by title
        schema:
          type: string
      - name: LabelsFilterExpression
        in: query
        description: Filter expression for labels
        schema:
          type: string
      - name: Statuses
        in: query
        description: Filter by content status (Draft or Active)
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ContentStatus'
      - name: Geo
        in: query
        description: Geographic targeting filter
        schema:
          type: string
      - name: OnlyLive
        in: query
        description: Filter to only return live stories
        schema:
          type: boolean
      - name: UpdateTime.From
        in: query
        schema:
          type: string
      - name: UpdateTime.To
        in: query
        schema:
          type: string
      - name: CreateTime.From
        in: query
        schema:
          type: string
      - name: CreateTime.To
        in: query
        schema:
          type: string
      - name: Entities.Game.WscId
        in: query
        schema:
          type: integer
          format: int32
      - name: Entities.Game.ServiceProviderId
        in: query
        schema:
          type: string
      - name: Entities.Team.WscId
        in: query
        schema:
          type: integer
          format: int32
      - name: Entities.Team.ServiceProviderId
        in: query
        schema:
          type: string
      - name: Entities.Player.WscId
        in: query
        schema:
          type: integer
          format: int32
      - name: Entities.Player.ServiceProviderId
        in: query
        schema:
          type: string
      - name: Entities.Round.WscId
        in: query
        schema:
          type: integer
          format: int32
      - name: Entities.Round.ServiceProviderId
        in: query
        schema:
          type: string
      - name: Entities.Season.WscId
        in: query
        schema:
          type: integer
          format: int32
      - name: Entities.Season.ServiceProviderId
        in: query
        schema:
          type: string
      - name: Entities.IdType
        in: query
        schema:
          $ref: '#/components/schemas/EntityIdType'
      - name: PageNum
        in: query
        description: Page number for pagination (0-based)
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
      - name: PageSize
        in: query
        description: Number of items per page
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryDTOPaginationSearchResponse'
  /v1/stories/ids:
    get:
      summary: Get stories by IDs
      description: Retrieves stories by their content IDs
      operationId: getStoriesByIds
      tags:
      - Feed
      parameters:
