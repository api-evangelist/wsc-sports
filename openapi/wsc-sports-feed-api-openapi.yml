  /v1/recommendations/trending:
    get:
      summary: Get trending content
      description: 'Retrieves the content that is currently trending for a single content type, ordered from the highest trending score to the lowest, up to 100 items. Trending scores are not exposed and no field marks an item as trending: the response order carries the ranking. Returns an empty result when trending is not enabled for the app and content type, or when there is no trending content.'
      operationId: getTrendingRecommendations
      tags:
      - Feed
      parameters:
      - name: ApiKey
        in: query
        description: API key authentication. Use the Feed Key, which differs from the app API key.
        required: true
        schema:
          type: string
      - name: ContentType
        in: query
        description: The content type to return trending content for. One value per call. Only Story and Moment are supported.
        required: true
        schema:
          type: string
          enum:
          - Story
          - Moment
      - name: Geo
        in: query
        description: Return content trending in a specific country, as an ISO 3166 two-letter country code, for example US. Omit for globally trending content.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponseDTO'
              examples:
                trending:
                  summary: Trending Moments
                  value:
                    lastUpdated: '2026-09-03T09:02:41Z'
                    recommendations:
                    - type: Moment
                      htmlUrl: null
                      id: 6a92fa1ee363eba308515c63
                      title: Late header seals the win
                      description: ''
                      subtitle: ''
                      version: 0
                      aspectRatios:
                      - Vertical
                      status: Active
                      duration: 14
                      createTime: '2026-08-29T15:26:22.95Z'
                      updateTime: '2026-08-29T21:34:17.801Z'
                      thumbnails:
                      - url: https://cdn.example.com/games/abc123/moment_VerticalTwoByThree.jpg
                        aspectRatio: TwoToThree
                      - url: https://cdn.example.com/games/abc123/moment_SquareIcon.jpg
                        aspectRatio: Square
                      - url: https://cdn.example.com/games/abc123/moment.gif
                        aspectRatio: Vertical
                      geoTargeting:
                        includedGeos: null
                        excludedGeos: null
                      metadata:
                        competition:
                          provider: null
                          providerId: null
                          wscId: 51282
                        competitions:
                        - provider: null
                          providerId: null
                          wscId: 51282
                        game: null
                        team: null
                        player: null
                        round: null
                        season: null
                      executionTimeType: None
                      labels:
                      - title: Goals
                        identifier: goals
                      - title: Season 2026
                        identifier: season_2026
                      extraInfo:
                        action: Play
                        eventMinute: SoccerEventMinute
                        activeLabels:
                        - goals
                        - season_2026
                      defaultLanguage: en
                      translatedTitles:
                        en: Late header seals the win
                        es: Un cabezazo tardío sella la victoria
                      translatedDescriptions: {}
                      translatedSubtitles: {}
                      competitionId: '51282'
                      publishMethod: null
                      creationSettings:
                        creationTimePeriod: None
                        ruleName: null
                        storyType: null
                      game: null
                      rating: null
                empty:
                  summary: Nothing trending, or trending not enabled
                  value:
                    lastUpdated: null
                    recommendations: []
        '400':
          description: Missing or unsupported ContentType, or an invalid Geo country code
