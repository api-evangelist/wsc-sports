tools:
- name: list-endpoints
  category: api-introspection
  description: Lists all API paths and their HTTP methods with summaries, organized by path.
- name: get-endpoint
  category: api-introspection
  description: Gets detailed information about a specific API endpoint, including security schemes and servers.
- name: search-endpoints
  category: api-introspection
  description: Performs a deep search through paths, operations, and parameters to discover relevant API endpoints.
- name: execute-request
  category: api-execution
  description: Executes an API request with a given HAR request object.
- name: search
  category: documentation
  description: Searches through documentation with the given search query, returning a list of results with ID, title and URL.
- name: fetch
  category: documentation
  description: Gets detailed content for documentation by ID returned from the search tool.
tool_count: 6
tools_file: mcp/wsc-sports-mcp-tools.json
notes:
- >-
  This is a ReadMe-platform MCP server fronting the provider's own documentation and OpenAPI. The tools are
  generic (introspect/execute/search) rather than one tool per business capability, so the agent-facing
  capability surface is the seven Blaze Feed API operations reached through execute-request, not six
  domain tools. The crosswalk in mcp/wsc-sports-tool-crosswalk.yml records that distinction.
- >-
  execute-request can call the live Blaze Feed API but the API itself requires a Feed API key issued by an
  account manager, so an agent still needs a provisioned credential to retrieve content.
