aid: wsc-sports
name: WSC Sports
description: 'WSC Sports Technologies is an Israeli sports-technology company whose AI platform automatically
  watches live sports broadcasts, identifies the moments that matter, and generates personalized short-form
  video — highlights, Stories and Moments — for leagues, broadcasters and rights holders. The developer
  surface is the Experiences product: a mobile-first embeddable SDK for iOS, Android, Web, React Native
  and Flutter that renders Stories, Moments and Videos inside a customer app, backed by the Arena CMS
  and the server-side Blaze Feed API, a read-only REST content-catalog and trending-recommendations API
  published as OpenAPI 3.0.1 at blazefeed.clipro.tv, complemented by outbound content-change webhooks
  and a public remote MCP server for AI coding assistants.'
